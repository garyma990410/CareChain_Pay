<title>CareChain Pay Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* Layout: caption bar on top; below it a life-stage rail, the phone App (本人／家屬) and the trustee workstation side by side.
   Brand: 預約之印 seal (朱砂) on 晨光照護 palette. Stage colours T0→T4 follow the sky from dawn to night; three gates have fixed colours.
   Under 1180px the trustee workstation and the phone switch by tab. All figures are 示意資料. */
:root{
  --lake:#1E4D5C; --seal:#C8372D; --sky:#5BA8C9; --sage:#8FC1B0; --sun:#F0A64B; --dusk:#E06C5A; --rice:#FBF6EF;
  --g1:#2F7FA8; --g2:#3E8C78; --g3:#D98A2B; --g1s:#DCEEF6; --g2s:#DDEFE9; --g3s:#FCE6C8;
  --bg:#EFE9DF; --surface:#FFFFFF; --surface2:#FBF6EF; --line:#E6DED2; --ink:#173540; --muted:#5F7177;
  --teal:#3E8C78; --teal-soft:#DDEFE9; --gold:#F0A64B; --gold-soft:#FCE6C8; --navy-soft:#E8EEEF; --blue-soft:#DCEEF6; --dusk-soft:#FBE2DC;
  --ok:#2E8C5A; --ok-soft:#E3F2EA; --warn:#9A5C08; --warn-soft:#FBEBCF; --crit:#9E2F4F; --crit-soft:#F5DDE4;
  --on-gate:#FFFFFF; --hdr:#1E4D5C; --hdr-ink:#FFFFFF; --bezel:#13262C; --accent-ink:#2B6E73; --pri:#1E4D5C; --pri-ink:#FFFFFF;
  --font:'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --serif:'Noto Serif TC','Noto Serif CJK TC','PMingLiU',serif;
  --num:'Poppins','Noto Sans TC','Noto Sans CJK TC',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --g1:#6AB3DA; --g2:#6FC0A6; --g3:#F0A64B; --g1s:#173447; --g2s:#173A33; --g3s:#3A2A12;
    --bg:#0C1A1F; --surface:#15282E; --surface2:#112228; --line:#28434B; --ink:#EAF1EF; --muted:#9DB0B3;
    --teal:#6FC0A6; --teal-soft:#173A33; --gold:#F0A64B; --gold-soft:#3A2A12; --navy-soft:#1C333A; --blue-soft:#173447; --dusk-soft:#3D221D;
    --ok:#5CC48E; --ok-soft:#133528; --warn:#F0B460; --warn-soft:#3A2A10; --crit:#F0819E; --crit-soft:#3E1C27;
    --on-gate:#0C1A1F; --seal:#E8604F; --hdr:#1A4250; --bezel:#050C0F; --accent-ink:#8FD3C0; --pri:#8FC1B0; --pri-ink:#0C1A1F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --g1:#6AB3DA; --g2:#6FC0A6; --g3:#F0A64B; --g1s:#173447; --g2s:#173A33; --g3s:#3A2A12;
  --bg:#0C1A1F; --surface:#15282E; --surface2:#112228; --line:#28434B; --ink:#EAF1EF; --muted:#9DB0B3;
  --teal:#6FC0A6; --teal-soft:#173A33; --gold:#F0A64B; --gold-soft:#3A2A12; --navy-soft:#1C333A; --blue-soft:#173447; --dusk-soft:#3D221D;
  --ok:#5CC48E; --ok-soft:#133528; --warn:#F0B460; --warn-soft:#3A2A10; --crit:#F0819E; --crit-soft:#3E1C27;
  --on-gate:#0C1A1F; --seal:#E8604F; --hdr:#1A4250; --bezel:#050C0F; --accent-ink:#8FD3C0; --pri:#8FC1B0; --pri-ink:#0C1A1F; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:18px 32px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.num,.big,.mid{font-family:var(--num);font-variant-numeric:tabular-nums}
.wrap{max-width:1520px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}

/* caption bar */
.cap{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--num);font-weight:600;font-size:16px;letter-spacing:-.01em}
.brand b em{font-style:normal;color:var(--seal)}
.brand span{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.capmsg{flex:1 1 340px;min-width:0}
.stg{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.04em;padding:3px 11px 3px 4px;border-radius:999px;background:var(--stage-soft,var(--navy-soft));color:var(--ink)}
.stg i{width:16px;height:16px;border-radius:50%;background:var(--stage,var(--lake));display:block}
.capmsg h2{margin:5px 0 2px;font-family:var(--serif);font-weight:900;font-size:20px;line-height:1.3;text-wrap:balance}
.capmsg p{margin:0;color:var(--muted);font-size:13px;max-width:78ch}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--lake)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn[disabled]{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:7px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink)}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--gold-soft);color:var(--warn);letter-spacing:.04em;white-space:nowrap}

/* shell */
.shell{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.rail{flex:0 0 250px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:14px}
.rail h3{margin:0;font-family:var(--serif);font-size:15px;font-weight:900}
.grp{display:flex;flex-direction:column;gap:4px;position:relative}
.grp .gl{font-size:12px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:7px}
.grp .gl i{width:12px;height:12px;border-radius:50%;display:block;flex:none}
.stp{display:flex;gap:9px;align-items:flex-start;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:7px 8px;width:100%}
.stp:hover{background:var(--surface2)}
.stp i{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-family:var(--num);font-size:11px;font-weight:600;color:var(--muted);margin-top:1px}
.stp span{font-size:13px;line-height:1.35}
.stp.on{background:var(--stage-soft);border-color:var(--stage)}
.stp.on i{background:var(--stage);border-color:var(--stage);color:#fff}
.stp.done i{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.shell.focus .rail{display:none}
.phone-col{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:10px}
.colcap{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.tw-col{flex:1 1 600px;min-width:0;display:flex;flex-direction:column;gap:10px}

/* phone */
.phone{width:min(392px,100%);height:812px;background:var(--bezel);border-radius:50px;padding:11px;box-shadow:0 18px 40px rgba(19,38,44,.28)}
.screen{height:100%;border-radius:40px;overflow:hidden;background:var(--surface2);display:flex;flex-direction:column;position:relative}
.sbar{height:34px;background:var(--hdr);color:var(--hdr-ink);display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-family:var(--num);font-size:12px;font-weight:600;flex:none}
.sbar .dots{display:flex;gap:5px;align-items:center}
.sbar .dots i{display:block;width:16px;height:8px;border-radius:2px;border:1.5px solid rgba(255,255,255,.8)}
.ahdr{background:var(--hdr);color:var(--hdr-ink);padding:6px 18px 16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex:none}
.ahdr small{display:flex;align-items:center;gap:6px;font-family:var(--num);font-size:11px;font-weight:600;letter-spacing:.02em;opacity:.9;margin-bottom:3px}
.ahdr h1{margin:0;font-family:var(--serif);font-weight:900;font-size:19px;line-height:1.25}
.who{font-size:11px;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:999px;white-space:nowrap}
.abody{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.abody>*{flex:none}
.nav{flex:none;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 4px 12px}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:3px 0;border-radius:10px;font-weight:500}
.nav button .ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--ink);font-weight:700}
.nav button.on .ib{background:var(--blue-soft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h4{margin:0 0 10px;font-size:13px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.lbl{font-size:11px;color:var(--muted)}
.big{font-size:27px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.mid{font-size:19px;font-weight:600;line-height:1.2}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 13px;display:flex;flex-direction:column;gap:3px;min-width:0}
.tile.hero{grid-column:1/-1;background:var(--lake);border-color:var(--lake);color:#fff;position:relative;overflow:hidden}
.tile.hero .lbl{color:#CFE4E6}
.tile.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(240,166,75,.55),rgba(240,166,75,0) 70%)}
.tile.warn{background:var(--gold-soft);border-color:transparent}
.tile.mo{background:var(--blue-soft);border-color:transparent}
.src{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.src:last-child{margin-bottom:0}
.src .r{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.src .r b{font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px}
.note{font-size:11px;color:var(--muted);line-height:1.5}
.ai{border:1px solid var(--g1);background:var(--g1s);border-radius:16px;padding:12px 13px;display:flex;flex-direction:column;gap:8px}
.ai .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ai b{font-size:13px;display:flex;align-items:center;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.chip.no{border-color:var(--crit);color:var(--crit);background:transparent}
.chip.yes{border-color:var(--g1);color:var(--g1)}
.sw{width:42px;height:24px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .18s}
.sw[aria-checked="true"]{background:var(--g1)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.cta{border:0;border-radius:14px;background:var(--pri);color:var(--pri-ink);padding:12px;font-weight:700;font-size:14px;width:100%}
.cta.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.cta[disabled]{opacity:.45}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.field .top b{font-size:15px;font-family:var(--num);font-weight:600}
input[type=range]{width:100%;accent-color:var(--lake);height:24px}
.seg2{display:flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface2);gap:3px}
.seg2 span{flex:1;text-align:center;font-size:12px;padding:6px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg2 span.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.res{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:10px}
.rbar{display:grid;grid-template-columns:78px 1fr 62px;gap:8px;align-items:center;font-size:12px}
.rbar .bar{height:11px}
.rbar em{font-style:normal;text-align:right;font-weight:600;font-family:var(--num)}
.plan{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.plan>button{width:100%;border:0;background:transparent;text-align:left;padding:0;display:block}
.plan .ph{padding:9px 13px;color:#fff;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.plan .ph span:first-child{display:flex;align-items:center;gap:8px}
.plan .pb{padding:11px 13px;display:flex;flex-direction:column;gap:7px;font-size:13px}
.plan .pb p{margin:0}
.plan .pb .k{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:1px}
.plan .pd{padding:10px 13px 13px;background:var(--surface2);border-top:1px dashed var(--line);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.tag{align-self:flex-start;font-size:11px;font-weight:700;padding:3px 10px;border-radius:7px}
.row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--muted);flex:none}
.row b{font-weight:600;text-align:right}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface2);display:flex;flex-direction:column;gap:4px;font-size:12px}
.role b{font-size:13px}
.st3{display:flex;flex-direction:column;gap:8px}
.st3 .it{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}
.st3 .it.ok{border-color:var(--gc);background:var(--gcs)}
.st3 .it.fail{border-color:var(--crit);background:var(--crit-soft)}
.st3 .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-weight:600;font-size:13px;background:var(--surface);border:2px solid var(--gc);color:var(--gc)}
.st3 .it.ok .n{background:var(--gc);color:var(--on-gate)}
.st3 .it.fail .n{background:var(--crit);border-color:var(--crit);color:#fff}
.st3 .tx{flex:1;min-width:0}
.st3 .tx b{display:block;font-size:13px}
.st3 .tx small{color:var(--muted);font-size:11px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-wait{background:var(--navy-soft);color:var(--muted)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-crit{background:var(--crit-soft);color:var(--crit)}
.p-teal{background:var(--g2s);color:var(--g2)}
.prog{display:flex;flex-direction:column}
.prog .s{display:flex;gap:11px;position:relative;padding-bottom:12px}
.prog .s:last-child{padding-bottom:0}
.prog .s::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.prog .s:last-child::before{display:none}
.prog .d{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-size:12px;font-weight:600;background:var(--line);color:var(--muted);z-index:1}
.prog .s.ok .d{background:var(--ok);color:#fff}
.prog .s.active .d{background:var(--sun);color:#2A1600}
.prog .s.fail .d{background:var(--crit);color:#fff}
.prog b{font-size:13px;display:block;line-height:1.3}
.prog small{font-size:11px;color:var(--muted)}
.banner{border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.5;display:flex;gap:10px;align-items:center}
.banner.i{background:var(--navy-soft);color:var(--ink)}
.banner.w{background:var(--warn-soft);color:var(--warn)}
.banner.c{background:var(--crit-soft);color:var(--crit)}
.banner.o{background:var(--ok-soft);color:var(--ok)}
.tl{display:flex;flex-direction:column}
.tl .e{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.tl .e:last-child{border-bottom:0}
.tl .e time{font-family:var(--num);font-size:11px;font-weight:600;padding-top:1px;display:flex;align-items:center;gap:5px;color:var(--muted)}
.tl .e time i{width:9px;height:9px;border-radius:50%;display:block}
.tl .e b{font-weight:600}

/* approval stamp */
.stamp{flex:none;display:block;width:86px;height:86px;color:var(--seal)}
.stamp.pop{animation:stamp .42s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{0%{transform:scale(1.9) rotate(-18deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}

/* trustee workstation */
.tw{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 12px 30px rgba(19,38,44,.12)}
.tw-bar{background:var(--hdr);color:var(--hdr-ink);padding:10px 16px;display:flex;align-items:center;gap:10px}
.tw-bar b{font-size:13px;font-family:var(--num);font-weight:600}
.tw-bar b em{font-style:normal;font-family:var(--font);font-weight:700}
.tw-bar span{margin-left:auto;font-size:11px;opacity:.8}
.tw-body{padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface2)}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.strip .m{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;min-width:0}
.strip .m>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.strip .m .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .m b{font-size:17px;line-height:1.2;font-family:var(--num);font-weight:600}
.strip .m svg{flex:none}
.tgrid{display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr);gap:12px;align-items:start}
.queue{display:flex;flex-direction:column;gap:8px}
.qi{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;width:100%}
.qi.on{border-color:var(--lake);box-shadow:0 0 0 2px var(--blue-soft)}
.qi .a{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.qi b{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h5{margin:0;font-size:15px}
.chk{display:flex;flex-direction:column}
.chk .c{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.chk .c:last-child{border-bottom:0}
.chk .c .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--ok)}
.chk .c.x .ic{background:var(--crit)}
.chk .c .ic svg{width:12px;height:12px}
.chk .c small{color:var(--muted);font-size:11px;white-space:nowrap}
.chk .g{font-size:11px;font-weight:700;letter-spacing:.06em;padding-top:8px;display:flex;align-items:center;gap:6px}
.chk .g i{width:10px;height:10px;border-radius:3px;display:block}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1 1 120px}
.btn.ok{background:var(--lake);border-color:var(--lake);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
:root[data-theme="dark"] .btn.ok{background:var(--sage);border-color:var(--sage);color:#0C1A1F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ok{background:var(--sage);border-color:var(--sage);color:#0C1A1F}}
.btn.no{border-color:var(--crit);color:var(--crit);background:transparent}
.acts .btn.ok{flex:2 1 190px;white-space:nowrap}
.gate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gate .g1{min-width:0;border:1.5px solid var(--gc);border-radius:10px;padding:7px 10px;font-size:12px;display:flex;gap:8px;align-items:center;background:var(--gc);color:var(--on-gate);font-weight:600}

.paidrow p{margin:0;font-size:12px;color:var(--ink);line-height:1.5}

function actApprove(id){
  var c=S.cases.filter(function(x){return x.id===id})[0];
  if(!c||c.final||!evalCase(c).all||S.revoked)return;
  c.final='paid';S.trustBal-=c.amount;S.pop=true;
  addLog('T3','受託人','覆核通過，依契約付款 '+fmt(c.amount)+' 至白名單帳戶（'+c.id+'）');

}
function actReturn(id,mode){
  var c=S.cases.filter(function(x){return x.id===id})[0];

  var keep={view:S.view,focus:S.focus,cap:S.cap};

  if(S.revoked)h+='<div class="banner c">已撤回授權：停止新的資料存取與流程，僅保留依法應保存的稽核紀錄。</div>';
  h+='<div class="card"><h4>'+icon('chain','var(--g2)',22,'var(--g2s)')+'稽核軌跡</h4><div class="tl">';
  S.log.slice().reverse().forEach(function(l){h+='<div class="e"><time><i style="background:'+STC[l.t]+'"></i>'+l.t+'</time><div><b>'+l.who+'</b><br>'+l.txt+'</div></div>'});
  h+='</div></div>';
  h+='<div class="card"><h4>'+icon('family','var(--g1)',22,'var(--g1s)')+'授權管理</h4>'+
   '<div class="row"><span>授權家屬</span><b>長女（示意）｜僅可檢視</b></div>'+
   '<div class="row"><span>資料範圍</span><b>保單、信託、支付進度</b></div>'+
   '<div class="row"><span>存證方式</span><b>API＋規則引擎（PoC）</b></div>'+
   '<button class="cta ghost" data-a="revoke" style="margin-top:10px">'+(S.revoked?'恢復授權':'撤回授權')+'</button></div>';
  h+='<p class="note" style="margin:0">聯盟鏈僅在多機構共同維護狀態時選配，鏈上只存摘要與狀態，不存健康資料。</p>';
  return h;
}
var SCR={dash:sDash,gap:sGap,plans:sPlans,trust:sTrust,pay:sPay,audit:sAudit};

/* ---------- trustee workstation ---------- */
function tw(){
  var sub=S.submitted;
  var pending=sub?S.cases.filter(function(c){return !c.final}).length:0;
  var h='<div class="tw-bar">'+SEAL(22)+'<b>CareChain Pay<em>・受託人覆核工作台</em></b><span>信託銀行端（示意）</span></div><div class="tw-body">';
  h+='<div class="strip">'+
   '<div class="m">'+icon('vault','var(--g2)',36,'var(--g2s)')+'<div><span class="lbl">王先生信託專戶</span><b>'+(S.insured?fmt(S.trustBal):'尚未入帳')+'</b></div></div>'+
   '<div class="m">'+icon('contract','var(--g2)',36,'var(--g2s)')+'<div><span class="lbl">契約本期上限</span><b>'+fmt(S.cap)+'</b></div></div>'+
   '<div class="m">'+icon('whitelist','var(--g1)',36,'var(--g1s)')+'<div><span class="lbl">白名單機構</span><b>2 家</b></div></div>'+
   '<div class="m">'+icon('trustee','var(--g3)',36,'var(--g3s)')+'<div><span class="lbl">待覆核案件</span><b style="color:'+(pending?'var(--warn)':'inherit')+'">'+pending+' 件</b></div></div></div>';
  if(S.revoked)h+='<div class="banner c">本人已撤回授權，新的資料存取與支付流程已暫停。核准功能停用，後續由金融機構依身分驗證與風控程序處理。</div>';
  if(!sub){
    h+='<div class="empty"><b style="color:var(--ink)">目前沒有待覆核案件</b><span>'+(S.insured?'保險金 '+fmt(INS_PAY)+' 已依約入專戶，等待照護機構提交請款。':(S.trustSigned?'信託契約已簽訂，等待保險公司完成核定。':'信託契約尚未簽訂。'))+'</span></div>';
    h+='<div class="panel"><h5>專戶異動</h5><div class="chk">'+
      (S.insured?'<div class="c"><span class="ic">'+ic('check',2.4)+'</span><span>保險金依約入專戶</span><small class="num">+'+fmt(INS_PAY)+'</small></div>':'<div class="c" style="grid-template-columns:1fr"><span class="note">尚無異動</span></div>')+
      '</div></div>';
  }else{
    var sel=S.cases.filter(function(c){return c.id===S.sel})[0]||S.cases[0];
    h+='<div class="tgrid"><div class="queue">';
    S.cases.forEach(function(c){
      h+='<button class="qi'+(c.id===sel.id?' on':'')+'" data-a="sel" data-v="'+c.id+'"><span class="a"><span>'+c.id+'</span><span class="num">'+c.period+'</span></span><b>'+c.org+'</b><span class="a"><span class="num" style="color:var(--ink);font-weight:600">'+fmt(c.amount)+'</span>'+pill(caseStatus(c))+'</span></button>';
    });
    h+='</div>'+detail(sel)+'</div>';
  }
  h+='<div class="panel"><h5 style="font-size:13px;display:flex;align-items:center;gap:8px">'+icon('chain','var(--g2)',22,'var(--g2s)')+'稽核軌跡（最近 4 筆）</h5><div class="tl">';
  S.log.slice(-4).reverse().forEach(function(l){h+='<div class="e"><time><i style="background:'+STC[l.t]+'"></i>'+l.t+'</time><div><b>'+l.who+'</b>｜'+l.txt+'</div></div>'});
  h+='</div></div></div>';
  return h;
}
function detail(c){
  var e=evalCase(c),st=caseStatus(c);
  var gate=function(n,t,ok,k){return '<div class="g1 '+(ok?'ok':'x')+'" style="--gc:var(--g'+k+')"><span style="width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:'+(ok?'rgba(255,255,255,.28)':'var(--crit)')+';color:'+(ok?'var(--on-gate)':'#fff')+'">'+ic(ok?'check':'x',2.4).replace('<svg','<svg style="width:12px;height:12px"')+'</span><span>'+n+' '+t+'</span></div>'};
  var h='<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap"><div><span class="lbl">案件 '+c.id+'</span><h5>'+c.org+'</h5></div>'+pill(st)+'</div>';
  h+='<div class="gate">'+gate('①','保險核定',e.s1,1)+gate('②','信託允付',e.s2,2)+gate('③','服務憑證',e.s3,3)+'</div>';
  h+='<div><div class="row"><span>請款金額</span><b class="num">'+fmt(c.amount)+'</b></div><div class="row"><span>服務期間</span><b class="num">'+c.period+'</b></div></div>';
  h+='<div class="chk">';
  [['階段① 保險核定事件',e.g1],['階段② 信託允付條件',e.g2],['階段③ 服務履約憑證',e.g3]].forEach(function(g,k){
    h+='<div class="g" style="color:var(--g'+(k+1)+')"><i style="background:var(--g'+(k+1)+')"></i>'+g[0]+'</div>';
    g[1].forEach(function(x){h+='<div class="c'+(x.ok?'':' x')+'"><span class="ic">'+ic(x.ok?'check':'x',2.4)+'</span><span>'+x.txt+'</span><small>'+x.who+'</small></div>'});
  });
  h+='</div>';
  if(c.final==='paid')h+='<div class="paidrow">'+STAMP(S.pop)+'<p><b>已依契約付款 '+fmt(c.amount)+'</b><br>款項撥付至白名單帳戶，並通知授權家屬。</p></div>';
  else if(c.final)h+='<div class="banner i">此案件已'+(c.final==='rejected'?'拒絕':'退回補件')+'，已寫入稽核軌跡。</div>';
  else if(e.kind==='ready')h+='<div class="banner o">三階段全部通過，已形成支付建議。實際給付由受託人依契約及內控核准。</div>';
  else if(e.kind==='blocked')h+='<div class="banner c">收款對象不在白名單內，系統不產生支付指令。請確認資格或更正收款資料。</div>';
  else h+='<div class="banner w">已停止一般流程並標記差異。請與服務機構覆核、補正或拒絕。</div>';
  if(!c.final){
    h+='<div class="acts">'+
      (e.kind==='ready'?'<button class="btn ok" data-a="approve" data-v="'+c.id+'"'+(S.revoked?' disabled':'')+'>'+SEAL(18)+'蓋章核准 '+fmt(c.amount)+'</button>':'')+
      '<button class="btn" data-a="return" data-v="'+c.id+'">退回補件</button>'+
      '<button class="btn no" data-a="reject" data-v="'+c.id+'">拒絕</button></div>';
  }
  return h+'</div>';
}

/* ---------- render ---------- */
function render(){
  var st=STEPS[S.step];
  var tk=st.g.slice(0,2),col=STC[tk];
  var cs=$('#c-stage');cs.innerHTML='<i></i>'+st.g;cs.style.setProperty('--stage',col);cs.style.setProperty('--stage-soft',soft(col));
  $('#brandseal').innerHTML=SEAL(38);$('#c-title').textContent=(S.step+1)+'／'+STEPS.length+'　'+st.t;$('#c-say').textContent=st.say;
  $('#b-next').disabled=S.step>=STEPS.length-1;
  $('#b-focus').textContent=S.focus?'顯示步驟列':'專注模式';
  var sh=$('#shell');sh.dataset.view=S.view;sh.classList.toggle('focus',S.focus);
  document.querySelectorAll('.seg button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===S.view))});
  $('#ahead').innerHTML='<header class="ahdr"><div><small>'+SEAL(16)+'CareChain Pay</small><h1>'+TITLE[S.screen]+'</h1></div><span class="who">王先生（示意）</span></header>';
  var body=$('#abody');body.innerHTML=SCR[S.screen]();body.scrollTop=0;
  $('#nav').innerHTML=NAV.map(function(n){return '<button data-a="nav" data-v="'+n[0]+'" class="'+(S.screen===n[0]?'on':'')+'"'+(S.screen===n[0]?' aria-current="page"':'')+'><span class="ib">'+icon(n[2],S.screen===n[0]?'var(--g3)':'var(--muted)',22)+'</span><span>'+n[1]+'</span></button>'}).join('');
  $('#tw').innerHTML=tw();
  S.pop=false;
  var groups=[],cur=null;
  STEPS.forEach(function(s,i){if(!cur||cur.g!==s.g){cur={g:s.g,items:[]};groups.push(cur)}cur.items.push(i)});
  $('#steps').innerHTML=groups.map(function(g){
    var gc=STC[g.g.slice(0,2)];
    return '<div class="grp" style="--stage:'+gc+';--stage-soft:'+soft(gc)+'"><div class="gl"><i style="background:'+gc+'"></i>'+g.g+'</div>'+g.items.map(function(i){
      var cls=i===S.step?' on':(i<S.step?' done':'');
      return '<button class="stp'+cls+'" data-a="step" data-v="'+i+'"><i>'+(i<S.step?'✓':i+1)+'</i><span>'+STEPS[i].t+'</span></button>';
    }).join('')+'</div>';
  }).join('');
}
function renderKeep(){ /* re-render without resetting app scroll */
  var b=$('#abody'),y=b.scrollTop;render();$('#abody').scrollTop=y;
}

/* ---------- events ---------- */
var timer=null;
function stopAuto(){if(timer){clearInterval(timer);timer=null}$('#b-auto').textContent='自動播放'}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},2200)}
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-a]');if(!el||el.disabled)return;
  var a=el.dataset.a,v=el.dataset.v;
  if(a==='step'){stopAuto();go(+v)}
  else if(a==='next'){stopAuto();go(S.step+1)}
  else if(a==='prev'){stopAuto();go(S.step-1)}
  else if(a==='auto'){
    if(timer){stopAuto();return}
    if(S.step>=STEPS.length-1)go(0);
    $('#b-auto').textContent='暫停播放';
    timer=setInterval(function(){if(S.step>=STEPS.length-1){stopAuto();return}go(S.step+1)},6500);
  }
  else if(a==='focus'){S.focus=!S.focus;render()}
  else if(a==='view'){S.view=v;render()}
  else if(a==='nav'){S.screen=v;render()}
  else if(a==='ai'){S.ai=!S.ai;renderKeep()}
  else if(a==='plan'){S.plan=S.plan===v?null:v;renderKeep()}
  else if(a==='refer'){toast('已轉介合格人員說明（示意）')}
  else if(a==='cap'){if(!S.insured){S.cap=Math.min(35000,Math.max(15000,S.cap+(+v)));renderKeep()}}
  else if(a==='sign'){actTrust();renderKeep();toast('已送交辦理（示意）')}
  else if(a==='sel'){S.sel=v;render()}
  else if(a==='approve'){actApprove(v);renderKeep();toast('已核准付款（示意）')}
  else if(a==='return'){actReturn(v,'returned');renderKeep()}
  else if(a==='reject'){actReturn(v,'rejected');renderKeep()}
  else if(a==='revoke'){S.revoked=!S.revoked;addLog('T3','本人',S.revoked?'撤回授權，停止新的資料存取與流程':'恢復授權');renderKeep()}
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='sp'){S.spend=+ev.target.value;updGap()}
  else if(ev.target.id==='yr'){S.years=+ev.target.value;updGap()}
});
document.addEventListener('keydown',function(ev){
  if(ev.target.tagName==='INPUT')return;
  if(ev.key==='ArrowRight'){stopAuto();go(S.step+1)}
  else if(ev.key==='ArrowLeft'){stopAuto();go(S.step-1)}
});

if(window.innerWidth<1180)S.view='app';
go(0);
window.CCP={go:go,setScreen:function(s){S.screen=s;render()},setView:function(v){S.view=v;render()},setFocus:function(f){S.focus=f;render()},select:function(id){S.sel=id;render()},approve:function(id){actApprove(id);render()},setCap:function(c){S.cap=c;render()},state:function(){return S}};
})();
</script>
